<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bretosolution — AI Visibility &amp; Web Growth</title>
    <meta name="description" content="Bretosolution helps restaurants and hospitality businesses improve their visibility on Google and AI search platforms and builds websites that convert visitors into customers." />
    <meta property="og:title" content="Bretosolution — AI Visibility &amp; Web Growth" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('breto-theme');
          if (stored === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
